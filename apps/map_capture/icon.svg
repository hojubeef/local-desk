<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23252b"/>
      <stop offset="100%" stop-color="#0f0f10"/>
    </linearGradient>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEE6B"/>
      <stop offset="55%" stop-color="#FEE500"/>
      <stop offset="100%" stop-color="#E8B400"/>
    </linearGradient>
    <radialGradient id="pinHighlight" cx="35%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEE500" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#FEE500" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FEE500" stop-opacity="0"/>
    </radialGradient>
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 배경: 둥근 사각형 -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bgGradient)"/>

  <!-- 옅은 그리드 (지도 느낌) -->
  <g stroke="#2a2b2f" stroke-width="1" opacity="0.45">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- 핀 뒤쪽 글로우 -->
  <circle cx="256" cy="240" r="170" fill="url(#ringGlow)"/>

  <!-- 핀 바닥 그림자(타원) -->
  <ellipse cx="256" cy="430" rx="58" ry="12" fill="#000000" opacity="0.45"/>

  <!-- 핀 본체 (물방울 형태) -->
  <g filter="url(#pinShadow)">
    <path d="
      M 256 88
      C 332 88 388 144 388 220
      C 388 280 348 332 296 380
      C 280 396 268 412 256 424
      C 244 412 232 396 216 380
      C 164 332 124 280 124 220
      C 124 144 180 88 256 88
      Z"
      fill="url(#pinGradient)"
      stroke="#A37D00"
      stroke-width="4"
      stroke-linejoin="round"/>

    <!-- 핀 광택 -->
    <path d="
      M 256 88
      C 332 88 388 144 388 220
      C 388 280 348 332 296 380
      C 280 396 268 412 256 424
      C 244 412 232 396 216 380
      C 164 332 124 280 124 220
      C 124 144 180 88 256 88
      Z"
      fill="url(#pinHighlight)"/>
  </g>

  <!-- 핀 안 위치 점 -->
  <circle cx="256" cy="220" r="46" fill="#171719" stroke="#0a0a0b" stroke-width="3"/>
  <circle cx="256" cy="220" r="22" fill="#FEE500"/>
  <circle cx="246" cy="210" r="6" fill="#FFFAD1" opacity="0.85"/>
</svg>
